<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Fenix — ephemeral Linux containers from any shell</title>
  <desc id="desc">Three terminals connect to a central Linux host that launches Ubuntu and Kali containers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111d"/><stop offset="1" stop-color="#030608"/></linearGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#ff4d36"/><stop offset=".52" stop-color="#ffb020"/><stop offset="1" stop-color="#fff27a"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#55d6ff" stroke-opacity=".055"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1440" height="720" fill="url(#bg)"/><rect width="1440" height="720" fill="url(#grid)"/>
  <text x="720" y="118" text-anchor="middle" fill="url(#fire)" font-family="monospace" font-size="76" font-weight="700" letter-spacing="18" filter="url(#glow)">FENIX</text>
  <text x="720" y="166" text-anchor="middle" fill="#9bb3c4" font-family="monospace" font-size="19" letter-spacing="4">EPHEMERAL LINUX CONTAINERS · ANY SHELL</text>
  <g fill="none" stroke="#55d6ff" stroke-width="3" stroke-opacity=".7"><path d="M250 355H535"/><path d="M905 355h285"/><path d="M720 455v92"/></g>
  <g font-family="monospace">
    <g transform="translate(70 285)"><rect width="310" height="142" rx="14" fill="#0c1824" stroke="#34647c" stroke-width="2"/><circle cx="24" cy="24" r="6" fill="#ff5f57"/><circle cx="44" cy="24" r="6" fill="#febc2e"/><circle cx="64" cy="24" r="6" fill="#28c840"/><text x="24" y="75" fill="#55d6ff" font-size="20">fnix $ f dev</text><text x="24" y="108" fill="#7892a5" font-size="16">ssh → box</text></g>
    <g transform="translate(1060 285)"><rect width="310" height="142" rx="14" fill="#0c1824" stroke="#34647c" stroke-width="2"/><circle cx="24" cy="24" r="6" fill="#ff5f57"/><circle cx="44" cy="24" r="6" fill="#febc2e"/><circle cx="64" cy="24" r="6" fill="#28c840"/><text x="24" y="75" fill="#55d6ff" font-size="20">mac $ k lab</text><text x="24" y="108" fill="#7892a5" font-size="16">ssh → box</text></g>
    <g transform="translate(535 250)"><rect width="370" height="205" rx="18" fill="#111d27" stroke="#ff9d24" stroke-width="3" filter="url(#glow)"/><text x="185" y="55" text-anchor="middle" fill="#ffbe45" font-size="22" font-weight="700">BOX</text><text x="185" y="92" text-anchor="middle" fill="#b8c7d1" font-size="17">Distrobox + Docker</text><rect x="54" y="121" width="118" height="54" rx="8" fill="#172c3b" stroke="#55d6ff"/><rect x="198" y="121" width="118" height="54" rx="8" fill="#2d1820" stroke="#ff5b6e"/><text x="113" y="154" text-anchor="middle" fill="#78ddff" font-size="15">UBUNTU</text><text x="257" y="154" text-anchor="middle" fill="#ff8291" font-size="15">KALI</text></g>
    <g transform="translate(570 548)"><rect width="300" height="78" rx="12" fill="#0c1824" stroke="#34647c" stroke-width="2"/><text x="150" y="34" text-anchor="middle" fill="#d4e3eb" font-size="16">shared /home/pi</text><text x="150" y="59" text-anchor="middle" fill="#7892a5" font-size="14">persistent work · isolated OS</text></g>
  </g>
</svg>
